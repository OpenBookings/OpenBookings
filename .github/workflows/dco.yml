name: DCO

# Checks that every commit in a pull request carries a Signed-off-by line for
# its author: the Developer Certificate of Origin (DCO). Merge commits and
# commits by bots are skipped. See CONTRIBUTING.md for how to fix a branch.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            case "$author_name" in *"[bot]") continue ;; esac
            expected="Signed-off-by: $author_name <$author_email>"
            if ! git show -s --format='%(trailers:key=Signed-off-by)' "$sha" | grep -qiF "$expected"; then
              echo "::error::Commit ${sha:0:7} (\"$(git show -s --format='%s' "$sha")\") has no '$expected' line."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing commit(s) are not signed off. Fix the branch with:"
            echo "  git rebase --signoff $BASE_SHA && git push --force-with-lease"
            echo "See CONTRIBUTING.md, 'Sign-off and CLA'."
            exit 1
          fi
          echo "Every commit is signed off."
