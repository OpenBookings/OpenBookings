name: OpenBookings - CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on main leaves no image for that SHA, so only PRs supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCW_REGISTRY: rg.nl-ams.scw.cloud
  SCW_NAMESPACE: namespace-distracted-saha

jobs:
  # ---- Pull requests only ----------------------------------------------------
  #
  # Everything that proves a change is correct runs on the PR, and only there.
  # A push to main does not re-run it: the PR already tested the merge of the
  # branch into main (refs/pull/N/merge), and with "Require branches to be up
  # to date before merging" on, that is the exact tree that lands. main only
  # builds, pushes and releases.
  #
  # Only what the PR touches is checked: `--affected` compares against the PR's
  # base and selects the changed packages plus everything that depends on
  # them. A change to apps/web runs web's tests and skips billing (~10 min) and
  # db (~7 min). A change to packages/db, bun.lock, turbo.json or the root
  # package.json still runs everything.

  checks:
    name: Lint & typecheck
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # --affected needs the base commit to diff against.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      # Turbo's local cache, so a second push to the same PR replays the
      # packages it did not change instead of linting them again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-checks-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: turbo-checks-${{ github.event.pull_request.number }}-

      - run: bun install --frozen-lockfile

      - run: bunx turbo run lint typecheck --affected

      # Unused, missing or unresolved dependencies across the whole repo
      # (~2 s, so not limited to --affected). Config in knip.json.
      - run: bun run knip

  test:
    name: Test
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      LOCAL_DB: postgres://postgres:postgres@localhost:5432/postgres
    # A local Postgres holding a copy of the real schema, not a Neon branch.
    #
    # The tests used to run against a throwaway Neon branch. Neon is in
    # Frankfurt and GitHub's runners are in the US, so every query took ~100 ms
    # (measured), and the DB suites issue thousands of them one after another:
    # the full run took ~10 min, billing alone ~10 and db ~7 of it. Against
    # this container, with the same schema, it takes ~10 s.
    #
    # What made the branch worth having still holds: the schema is whatever the
    # dev database actually has -- the Better Auth / IAM tables nothing in this
    # repo creates, PostGIS, views -- fetched from Neon's API below, with no
    # schema of our own to keep in sync. Same major as Neon (17) and the same
    # PostGIS; a check below fails the job if Neon moves to another major.
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      # Replays a package's tests only when nothing it depends on changed --
      # migrations included, since packages/db/drizzle is part of db's hash.
      # Not covered: a schema change on the dev database between two pushes.
      # The cache is per PR, so that window is the life of one PR.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-test-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: turbo-test-${{ github.event.pull_request.number }}-

      - run: bun install --frozen-lockfile

      # Not the demo package: its tests generate demo hotels (slow) and only
      # check the local testing setup. Run them with `bun run test` locally.
      - name: Work out which packages to test
        id: affected
        run: |
          set -euo pipefail
          packages=$(bunx turbo run test --affected --filter='!@openbookings/demo' --dry=json \
            | jq -r '[.tasks[] | select(.task == "test") | .package] | unique | join(" ")')
          echo "Affected: ${packages:-none}"
          if [ -n "$packages" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # Neon renders the dump server side, next to the database: one request,
      # ~1.5 s. A pg_dump from here makes ~1,000 catalog queries across the
      # Atlantic and takes ~95 s. Read-only, and no branch is created.
      - name: Fetch the dev database's schema
        if: steps.affected.outputs.any == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          # The default branch of the openbookings-dev project, by id rather
          # than name -- it is confusingly *called* "production".
          BRANCH_ID: br-frosty-wildflower-alcqwefl
        run: |
          set -euo pipefail
          curl -fsS --retry 3 -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID/schema?db_name=neondb" \
            | jq -er .sql > schema.sql

          neon_major=$(grep -oE 'Dumped from database version [0-9]+' schema.sql | grep -oE '[0-9]+$')
          local_major=$(psql "$LOCAL_DB" -XAtc 'show server_version_num' | cut -c1-2)
          if [ "$neon_major" != "$local_major" ]; then
            echo "::error::Neon runs Postgres $neon_major but the test container is $local_major. Update the postgis/postgis image in ci.yml."
            exit 1
          fi

      # The roles the dump grants to and owns objects as (neondb_owner,
      # authenticated, ...), so ownership, grants and policies load as on
      # Neon. Then every error fails the job except the two Neon-only
      # extensions, which no table uses: a column of type `vector` would still
      # fail, as "type does not exist". A quiet partial restore would mean
      # tests passing against a schema that is not the real one.
      - name: Load it into the test database
        if: steps.affected.outputs.any == 'true'
        run: |
          set -euo pipefail
          grep -oE '(OWNER TO|GRANT .* TO|FOR ROLE) "?[a-z_][a-z0-9_]*"?' schema.sql \
            | awk '{print $NF}' | tr -d '"' | sort -u \
            | grep -vxE 'public|current_user|session_user|postgres' \
            | while read -r role; do
                psql "$LOCAL_DB" -XAtqc "CREATE ROLE \"$role\""
              done

          psql "$LOCAL_DB" -X -q -f schema.sql > restore.log 2>&1 || true
          errors=$(grep 'ERROR:' restore.log \
            | grep -vE 'extension "(pg_session_jwt|vector)" (is not available|does not exist)' || true)
          if [ -n "$errors" ]; then
            echo "::error::The schema did not load cleanly into the test database."
            echo "$errors"
            exit 1
          fi
          psql "$LOCAL_DB" -XAtc "select count(*) || ' tables loaded' from pg_tables where schemaname = 'public'"

      # Once, so the tests need not replay them each (see
      # packages/db/scripts/apply-pending-ci.ts).
      - name: Apply this branch's pending migrations
        if: steps.affected.outputs.any == 'true'
        env:
          DATABASE_URL_DIRECT: ${{ env.LOCAL_DB }}
        run: bun run --cwd packages/db db:apply-pending:ci

      # Four packages at a time: the suites open pools of up to 20 connections
      # each, against the container's default of 100.
      - name: Run tests
        if: steps.affected.outputs.any == 'true'
        env:
          DATABASE_URL: ${{ env.LOCAL_DB }}
          DATABASE_URL_DIRECT: ${{ env.LOCAL_DB }}
          PENDING_MIGRATIONS_APPLIED: "1"
        run: bunx turbo run test --affected --filter='!@openbookings/demo' --concurrency=4

  # The one check branch protection needs to require. Keeps the old job's name,
  # so an existing "Verify" required check keeps working.
  verify:
    name: Verify
    needs: [checks, test]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Lint, typecheck and tests all passed
        env:
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "Lint & typecheck: $CHECKS, Test: $TEST"
          [ "$CHECKS" = "success" ] && [ "$TEST" = "success" ]

  # ---- Pull requests and main ------------------------------------------------

  detect:
    name: Detect changed apps
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      business: ${{ steps.filter.outputs.business }}
      docs: ${{ steps.filter.outputs.docs }}
      support: ${{ steps.filter.outputs.support }}
      invoice-job: ${{ steps.filter.outputs.invoice-job }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # ci.yml and .github/scripts are in every app filter. ci.yml
          # defines the build args, so changing it changes what lands in the
          # image. The scripts are not a build input at all -- but rolling is
          # gated on an image having been rebuilt, so without this a fix to
          # roll-container.sh or check-release.sh can never reach production.
          # Both omissions orphan a correction until some unrelated commit
          # happens to trigger a rebuild.
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            business:
              - 'apps/business/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            docs:
              - 'apps/docs/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            support:
              - 'apps/support-bot/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            invoice-job:
              - 'apps/invoice-job/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            # Only the migration files, not the whole db package: a schema.ts
            # edit with no accompanying .sql has nothing to apply.
            db:
              - 'packages/db/drizzle/**'

  build-web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # Layer cache: the dependency install is reused whenever bun.lock and
          # the package manifests did not change. Only main writes it (PR caches
          # are scoped to the PR and would just crowd the 10 GB limit); PRs read
          # main's.
          cache-from: type=gha,scope=web
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=web,mode=max' || '' }}
          # A mounted secret, not a build arg: build args are recorded in build
          # metadata and provenance attestations, and this token can write to
          # every project in the org. It is only needed to upload source maps --
          # without it the build still succeeds, it just ships minified traces.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          # The SHA tag is immutable and is what `release` and `rollback`
          # point at. `main` moves, and exists only so a human can say
          # "the current release" -- never `latest`, which invites a
          # platform to pull something nobody chose.
          tags: |
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-web:${{ github.sha }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-web:main
          build-args: |
            # Both origins, under the same names the code reads. Every image
            # gets both because the two apps link at each other.
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_BUSINESS_URL=${{ vars.NEXT_PUBLIC_BUSINESS_URL }}

            # App specific Args
            #
            # The DSN picks which Sentry project an event lands in, so each app
            # needs its own -- one shared var piles both apps' errors into a
            # single project. Web reports to `openbookings-guests` and business
            # to `openbookings-business`, matching `project` in next.config.ts.
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_WEB_SENTRY_DSN }}

            # General Args
            NEXT_PUBLIC_COOKIE_VERSION=${{ vars.NEXT_PUBLIC_COOKIE_VERSION }}
            NEXT_PUBLIC_MAPTILER_API_KEY=${{ vars.NEXT_PUBLIC_MAPTILER_API_KEY }}
            NEXT_PUBLIC_MAPTILER_STYLE_ID=${{ vars.NEXT_PUBLIC_MAPTILER_STYLE_ID }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

            # Baked into the image so /api/health, Sentry and PostHog can all
            # name the commit serving a request.
            NEXT_PUBLIC_RELEASE_SHA=${{ github.sha }}

  build-business:
    needs: detect
    if: needs.detect.outputs.business == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/business/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # Layer cache: the dependency install is reused whenever bun.lock and
          # the package manifests did not change. Only main writes it (PR caches
          # are scoped to the PR and would just crowd the 10 GB limit); PRs read
          # main's.
          cache-from: type=gha,scope=business
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=business,mode=max' || '' }}
          # A mounted secret, not a build arg: build args are recorded in build
          # metadata and provenance attestations, and this token can write to
          # every project in the org. It is only needed to upload source maps --
          # without it the build still succeeds, it just ships minified traces.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          # The SHA tag is immutable and is what `release` and `rollback`
          # point at. `main` moves, and exists only so a human can say
          # "the current release" -- never `latest`, which invites a
          # platform to pull something nobody chose.
          tags: |
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-business:${{ github.sha }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-business:main
          build-args: |
            # Both origins, under the same names the code reads. Every image
            # gets both because the two apps link at each other.
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_BUSINESS_URL=${{ vars.NEXT_PUBLIC_BUSINESS_URL }}

            # App specific Args
            NEXT_PUBLIC_REALTIME_WORKER_URL=${{ vars.NEXT_PUBLIC_BUSINESS_REALTIME_WORKER_URL }}
            # Its own Sentry project -- see build-web for why these are split.
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_BUSINESS_SENTRY_DSN }}
            # Host support: the browser's Chatwoot websocket origin (also added
            # to the CSP). Runtime switches and secrets are set on the deployment.
            NEXT_PUBLIC_CHATWOOT_BASE_URL=${{ vars.NEXT_PUBLIC_CHATWOOT_BASE_URL }}

            # General Args
            NEXT_PUBLIC_COOKIE_VERSION=${{ vars.NEXT_PUBLIC_COOKIE_VERSION }}
            NEXT_PUBLIC_MAPTILER_API_KEY=${{ vars.NEXT_PUBLIC_MAPTILER_API_KEY }}
            NEXT_PUBLIC_MAPTILER_STYLE_ID=${{ vars.NEXT_PUBLIC_MAPTILER_STYLE_ID }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}

            # Baked into the image so /api/health, Sentry and PostHog can all
            # name the commit serving a request.
            NEXT_PUBLIC_RELEASE_SHA=${{ github.sha }}

  build-docs:
    needs: detect
    if: needs.detect.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/docs/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # Layer cache: the dependency install is reused whenever bun.lock and
          # the package manifests did not change. Only main writes it (PR caches
          # are scoped to the PR and would just crowd the 10 GB limit); PRs read
          # main's.
          cache-from: type=gha,scope=docs
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=docs,mode=max' || '' }}
          # The SHA tag is immutable and is what `release` and `rollback`
          # point at. `main` moves, and exists only so a human can say
          # "the current release" -- never `latest`, which invites a
          # platform to pull something nobody chose.
          tags: |
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-docs:${{ github.sha }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-docs:main

  build-support:
    needs: detect
    if: needs.detect.outputs.support == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/support-bot/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # Layer cache: the dependency install is reused whenever bun.lock and
          # the package manifests did not change. Only main writes it (PR caches
          # are scoped to the PR and would just crowd the 10 GB limit); PRs read
          # main's.
          cache-from: type=gha,scope=support-bot
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=support-bot,mode=max' || '' }}
          # The SHA tag is immutable and is what `release` and `rollback`
          # point at. `main` moves, and exists only so a human can say
          # "the current release" -- never `latest`, which invites a
          # platform to pull something nobody chose.
          tags: |
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-support:${{ github.sha }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-support:main

  # The monthly commission-invoice job. A Scaleway Serverless Job, not a
  # container: built and pushed here, never rolled. The job definition points
  # at the `main` tag, so each run picks up the latest image (see
  # apps/invoice-job/README.md).
  build-invoice-job:
    needs: detect
    if: needs.detect.outputs.invoice-job == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/invoice-job/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # Layer cache: the dependency install is reused whenever bun.lock and
          # the package manifests did not change. Only main writes it (PR caches
          # are scoped to the PR and would just crowd the 10 GB limit); PRs read
          # main's.
          cache-from: type=gha,scope=invoice-job
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=invoice-job,mode=max' || '' }}
          # The SHA tag is immutable and is what `release` and `rollback`
          # point at. `main` moves, and exists only so a human can say
          # "the current release" -- never `latest`, which invites a
          # platform to pull something nobody chose.
          tags: |
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-invoice-job:${{ github.sha }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-invoice-job:main

  release:
    name: Release
    needs: [detect, build-web, build-business, build-docs, build-support, build-invoice-job]
    # Tests do not run here: they passed on the PR (see `checks` and `test`).
    # `!failure()` stops a release when any build failed; `!cancelled()` still
    # lets *skipped* builds through, which is the normal case -- an app whose
    # paths did not change has no new image and simply is not rolled.
    if: ${{ github.event_name == 'push' && needs.detect.result == 'success' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # The single gate for the whole release: a required reviewer, and a
    # deployment branch policy limiting this environment to `main`. Asked once
    # -- which is why migrations and container rolls are one job, not several.
    #
    # Every secret below is repo-scoped, not environment-scoped -- the
    # environment's protection is the required reviewer and the main-only
    # branch policy, not secret isolation. Nothing reachable from a
    # pull_request references them (this job is push-only, and the build-*
    # jobs use only SCW_SECRET_KEY, for registry login), so a PR still cannot
    # reach them. Moving them onto the environment would make that structural
    # rather than a property of how the jobs happen to be wired today.
    environment: production
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      # The CLI refuses every `container` call without this, even though the
      # container is addressed by id and the project is already set:
      # "organization ID is required".
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      # Match the registry's region unless told otherwise.
      SCW_DEFAULT_REGION: ${{ vars.SCW_REGION || 'nl-ams' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- Migrations, before any container moves ----------------------------
      #
      # A canary (and any rollback) means two code versions share one database,
      # so every migration must be backward-compatible -- expand/contract, never
      # a drop or a rename in the same release that stops writing the column.

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.detect.outputs.db == 'true'
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        if: needs.detect.outputs.db == 'true'
        run: bun install --frozen-lockfile

      # See packages/db/scripts/migrate-ci.ts for why this is not
      # `drizzle-kit migrate`: ./drizzle has no journal to diff against.
      - name: Apply database migrations
        if: needs.detect.outputs.db == 'true'
        working-directory: packages/db
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: bun run db:migrate:ci

      # ---- Containers --------------------------------------------------------

      - name: Install the Scaleway CLI
        env:
          SCW_CLI_VERSION: 2.62.0
          SCW_CLI_SHA256: 7638c385c1a43a5d9022a63791769fd464e14314032a51411726f062f3053e67
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/scw \
            "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          echo "${SCW_CLI_SHA256}  /tmp/scw" | sha256sum -c -
          chmod +x /tmp/scw
          sudo mv /tmp/scw /usr/local/bin/scw

      # support-bot is built and pushed above but deliberately not rolled:
      # there is no support-bot Serverless Container, so there is nothing to
      # point at an image. Because `packages/**` is in the support paths
      # filter, leaving it here would fail nearly every release on a missing
      # SCW_CONTAINER_ID_SUPPORT. Add the roll back when the container exists.
      - name: Roll the containers whose images were rebuilt
        env:
          IMAGE_BASE: ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}
          WEB_BUILT: ${{ needs.detect.outputs.web }}
          BUSINESS_BUILT: ${{ needs.detect.outputs.business }}
          DOCS_BUILT: ${{ needs.detect.outputs.docs }}
          WEB_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID_WEB }}
          BUSINESS_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID_BUSINESS }}
          DOCS_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID_DOCS }}
        run: |
          set -euo pipefail

          roll_if_built() {
            local app="$1" built="$2" container_id="$3"

            if [ "$built" != "true" ]; then
              echo "${app}: unchanged, nothing to roll"
              return 0
            fi

            if [ -z "$container_id" ]; then
              local var_name
              var_name="SCW_CONTAINER_ID_$(echo "$app" | tr '[:lower:]' '[:upper:]')"
              echo "::error::${app} was rebuilt but repository variable ${var_name} is not set"
              return 1
            fi

            .github/scripts/roll-container.sh \
              "$container_id" \
              "${IMAGE_BASE}/openbookings-${app}:${GITHUB_SHA}"
          }

          roll_if_built web      "$WEB_BUILT"      "$WEB_CONTAINER_ID"
          roll_if_built business "$BUSINESS_BUILT" "$BUSINESS_CONTAINER_ID"
          roll_if_built docs     "$DOCS_BUILT"     "$DOCS_CONTAINER_ID"

          if [ "$WEB_BUILT" = "true" ] || [ "$BUSINESS_BUILT" = "true" ] || [ "$DOCS_BUILT" = "true" ]; then
            echo "Released ${GITHUB_SHA}"
          else
            echo "Nothing to release: no app image was rebuilt for ${GITHUB_SHA}"
          fi

      # Rolling to `ready` only proves Scaleway accepted the image. This proves
      # the thing actually answering openbookings.co is running this commit.
      # Only web is probed here. Business now takes the NEXT_PUBLIC_RELEASE_SHA
      # build arg and reports it from /api/health too, so it could be probed the
      # same way; docs and support-bot still cannot. Adding that step gates a
      # business release on the probe, so it is a deliberate choice, not a
      # consequence of this build arg existing.
      - name: Confirm web is serving this commit
        if: needs.detect.outputs.web == 'true'
        env:
          OB_PROBE_TOKEN: ${{ secrets.OB_PROBE_TOKEN }}
        run: .github/scripts/check-release.sh openbookings.co "$GITHUB_SHA"

      # ---- Registry ----------------------------------------------------------
      #
      # Last, and only after the release held: pruning before the roll could
      # delete the image a failed release needs to fall back to. Every app is
      # pruned every time, not just the rebuilt ones -- it is idempotent, and
      # it is the only thing that ever cleans up support, which is pushed but
      # never rolled.
      #
      # This bounds rollback.yml to the SHAs kept here. See prune-registry.sh
      # for what is exempt.
      #
      # continue-on-error because production is already on the new commit by
      # now: a failed delete should show up as an annotation, not turn a good
      # release red and invite a rollback nobody needs.
      - name: Prune old images from the registry
        continue-on-error: true
        env:
          KEEP: 3
          PROTECT_TAGS: ${{ github.sha }}
          WEB_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID_WEB }}
          BUSINESS_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID_BUSINESS }}
          DOCS_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID_DOCS }}
        run: |
          set -uo pipefail

          failed=0
          .github/scripts/prune-registry.sh openbookings-web      "$WEB_CONTAINER_ID"      || failed=1
          .github/scripts/prune-registry.sh openbookings-business "$BUSINESS_CONTAINER_ID" || failed=1
          .github/scripts/prune-registry.sh openbookings-docs     "$DOCS_CONTAINER_ID"     || failed=1
          .github/scripts/prune-registry.sh openbookings-support                           || failed=1
          .github/scripts/prune-registry.sh openbookings-invoice-job                       || failed=1
          exit "$failed"
