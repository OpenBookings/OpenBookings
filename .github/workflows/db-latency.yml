# TEMPORARY: measures the round trip from a GitHub runner to a Neon CI branch,
# to check whether the slow DB tests are latency bound. Delete after reading.
name: DB latency probe

on:
  push:
    branches: ["claude/confident-lamport-1wxknx"]
    paths: [".github/workflows/db-latency.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Where is this runner?
        run: curl -fsS https://ipinfo.io/json | jq '{city, region, country, org}' || true

      - name: Create a throwaway database branch
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: br-frosty-wildflower-alcqwefl
          branch_name: ci-latency-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Measure
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set -uo pipefail
          # Wake the compute first, so boot time is not counted.
          for i in $(seq 1 30); do
            PGCONNECT_TIMEOUT=10 psql "$DATABASE_URL" -XAtqc 'select 1' >/dev/null 2>&1 && break
            sleep 2
          done

          echo "## Host"
          echo "$DATABASE_URL" | sed -E 's#.*@([^/:]+).*#\1#'

          echo "## 30 x 'select 1' on one connection (ms each)"
          { echo '\timing on'; for i in $(seq 1 30); do echo 'select 1;'; done; } \
            | psql "$DATABASE_URL" -X -q -o /dev/null 2>&1 \
            | grep -o 'Time: [0-9.]*' | awk '{print $2}' | sort -n \
            | awk '{a[NR]=$1; s+=$1} END {printf "min %.1f  median %.1f  max %.1f  mean %.1f\n", a[1], a[int((NR+1)/2)], a[NR], s/NR}'

          echo "## 5 x new connection + 'select 1' (TLS handshake included, ms)"
          for i in $(seq 1 5); do
            start=$(date +%s%N)
            psql "$DATABASE_URL" -XAtqc 'select 1' >/dev/null
            echo $(( ($(date +%s%N) - start) / 1000000 ))
          done

      - name: Delete the throwaway database branch
        if: ${{ always() && steps.neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
