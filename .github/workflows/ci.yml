name: OpenBookings - CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on main leaves no image for that SHA, so only PRs supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCW_REGISTRY: rg.nl-ams.scw.cloud
  SCW_NAMESPACE: namespace-distracted-saha

jobs:
  verify:
    name: Verify
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      # A throwaway Neon branch, not a Postgres service container.
      #
      # The container could only ever hold what drizzle-kit export renders from
      # src/schema.ts, and that is 24 tables -- it does not include `user`,
      # `session`, `organization`, `property_access` or the other eleven
      # Better Auth / IAM tables, because nothing in this repo creates them.
      # Queries that join `"user"` (the ARI availability read, support.ts)
      # therefore could not be tested at all, and 0007, 0011 and 0012 would
      # fail to apply to a genuinely empty database.
      #
      # A branch is a copy-on-write clone of the real thing, so the schema is
      # whatever production actually has, PostGIS included, with no schema step
      # to keep in sync. It is writable, which the tests need -- they insert
      # fixtures inside a transaction and roll it back.
      - name: Create a throwaway database branch
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # The default branch of the openbookings-dev project, by id rather
          # than name -- it is confusingly *called* "production".
          parent_branch: br-frosty-wildflower-alcqwefl
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # The direct endpoint, not the pooled one: the pooler rewrites and
      # batches statements, and these tests drive explicit transactions.
      - name: Run tests
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: bun run test

      # Always, including when the tests failed -- an abandoned branch keeps
      # billing. Skipped only if the branch was never created, where there is
      # nothing to delete and the delete would itself fail.
      - name: Delete the throwaway database branch
        if: ${{ always() && steps.neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

  detect:
    name: Detect changed apps
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      business: ${{ steps.filter.outputs.business }}
      docs: ${{ steps.filter.outputs.docs }}
      support: ${{ steps.filter.outputs.support }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # ci.yml and .github/scripts are in every app filter. ci.yml
          # defines the build args, so changing it changes what lands in the
          # image. The scripts are not a build input at all -- but rolling is
          # gated on an image having been rebuilt, so without this a fix to
          # roll-container.sh or check-release.sh can never reach production.
          # Both omissions orphan a correction until some unrelated commit
          # happens to trigger a rebuild.
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            business:
              - 'apps/business/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            docs:
              - 'apps/docs/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            support:
              - 'apps/support-bot/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            # Only the migration files, not the whole db package: a schema.ts
            # edit with no accompanying .sql has nothing to apply.
            db:
              - 'packages/db/drizzle/**'

  build-web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # The SHA tag is immutable and is what `release` and `rollback`
          # point at. `main` moves, and exists only so a human can say
          # "the current release" -- never `latest`, which invites a
          # platform to pull something nobody chose.
          tags: |
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-web:${{ github.sha }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-web:main
          build-args: |
            # Both origins, under the same names the code reads. Every image
            # gets both because the two apps link at each other.
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_BUSINESS_URL=${{ vars.NEXT_PUBLIC_BUSINESS_URL }}

            # General Args
            NEXT_PUBLIC_COOKIE_VERSION=${{ vars.NEXT_PUBLIC_COOKIE_VERSION }}
            NEXT_PUBLIC_MAPTILER_API_KEY=${{ vars.NEXT_PUBLIC_MAPTILER_API_KEY }}
            NEXT_PUBLIC_MAPTILER_STYLE_ID=${{ vars.NEXT_PUBLIC_MAPTILER_STYLE_ID }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

            # Baked into the image so /api/health, Sentry and PostHog can all
            # name the commit serving a request.
            NEXT_PUBLIC_RELEASE_SHA=${{ github.sha }}

  build-business:
    needs: detect
    if: needs.detect.outputs.business == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./apps/business/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # The SHA tag is immutable and is what `release` and `rollback`
          # point at. `main` moves, and exists only so a human can say
          # "the current release" -- never `latest`, which invites a
          # platform to pull something nobody chose.
          tags: |
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-business:${{ github.sha }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-business:main
          build-args: |
            # Both origins, under the same names the code reads. Every image
            # gets both because the two apps link at each other.
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_BUSINESS_URL=${{ vars.NEXT_PUBLIC_BUSINESS_URL }}

            # App specific Args
            NEXT_PUBLIC_REALTIME_WORKER_URL=${{ vars.NEXT_PUBLIC_BUSINESS_REALTIME_WORKER_URL }}

            # General Args
            NEXT_PUBLIC_COOKIE_VERSION=${{ vars.NEXT_PUBLIC_COOKIE_VERSION }}
            NEXT_PUBLIC_MAPTILER_API_KEY=${{ vars.NEXT_PUBLIC_MAPTILER_API_KEY }}
            NEXT_PUBLIC_MAPTILER_STYLE_ID=${{ vars.NEXT_PUBLIC_MAPTILER_STYLE_ID }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

  build-docs:
    needs: detect
    if: needs.detect.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./apps/docs/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # The SHA tag is immutable and is what `release` and `rollback`
          # point at. `main` moves, and exists only so a human can say
          # "the current release" -- never `latest`, which invites a
          # platform to pull something nobody chose.
          tags: |
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-docs:${{ github.sha }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-docs:main

  build-support:
    needs: detect
    if: needs.detect.outputs.support == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.SCW_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./apps/support-bot/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # The SHA tag is immutable and is what `release` and `rollback`
          # point at. `main` moves, and exists only so a human can say
          # "the current release" -- never `latest`, which invites a
          # platform to pull something nobody chose.
          tags: |
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-support:${{ github.sha }}
            ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}/openbookings-support:main

  release:
    name: Release
    needs: [detect, build-web, build-business, build-docs, build-support]
    # `detect.result == 'success'` implies verify passed, since detect needs it.
    # `!failure()` stops a release when any build failed; `!cancelled()` still
    # lets *skipped* builds through, which is the normal case -- an app whose
    # paths did not change has no new image and simply is not rolled.
    if: ${{ github.event_name == 'push' && needs.detect.result == 'success' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # The single gate for the whole release: a required reviewer, and a
    # deployment branch policy limiting this environment to `main`. Asked once
    # -- which is why migrations and container rolls are one job, not several.
    #
    # Every secret below is repo-scoped, not environment-scoped -- the
    # environment's protection is the required reviewer and the main-only
    # branch policy, not secret isolation. Nothing reachable from a
    # pull_request references them (this job is push-only, and the build-*
    # jobs use only SCW_SECRET_KEY, for registry login), so a PR still cannot
    # reach them. Moving them onto the environment would make that structural
    # rather than a property of how the jobs happen to be wired today.
    environment: production
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      # The CLI refuses every `container` call without this, even though the
      # container is addressed by id and the project is already set:
      # "organization ID is required".
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      # Match the registry's region unless told otherwise.
      SCW_DEFAULT_REGION: ${{ vars.SCW_REGION || 'nl-ams' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # ---- Migrations, before any container moves ----------------------------
      #
      # A canary (and any rollback) means two code versions share one database,
      # so every migration must be backward-compatible -- expand/contract, never
      # a drop or a rename in the same release that stops writing the column.

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.detect.outputs.db == 'true'
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        if: needs.detect.outputs.db == 'true'
        run: bun install --frozen-lockfile

      # See packages/db/scripts/migrate-ci.ts for why this is not
      # `drizzle-kit migrate`: ./drizzle has no journal to diff against.
      - name: Apply database migrations
        if: needs.detect.outputs.db == 'true'
        working-directory: packages/db
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: bun run db:migrate:ci

      # ---- Containers --------------------------------------------------------

      - name: Install the Scaleway CLI
        env:
          SCW_CLI_VERSION: 2.62.0
          SCW_CLI_SHA256: 7638c385c1a43a5d9022a63791769fd464e14314032a51411726f062f3053e67
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/scw \
            "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          echo "${SCW_CLI_SHA256}  /tmp/scw" | sha256sum -c -
          chmod +x /tmp/scw
          sudo mv /tmp/scw /usr/local/bin/scw

      # support-bot is built and pushed above but deliberately not rolled:
      # there is no support-bot Serverless Container, so there is nothing to
      # point at an image. Because `packages/**` is in the support paths
      # filter, leaving it here would fail nearly every release on a missing
      # SCW_CONTAINER_ID_SUPPORT. Add the roll back when the container exists.
      - name: Roll the containers whose images were rebuilt
        env:
          IMAGE_BASE: ${{ env.SCW_REGISTRY }}/${{ env.SCW_NAMESPACE }}
          WEB_BUILT: ${{ needs.detect.outputs.web }}
          BUSINESS_BUILT: ${{ needs.detect.outputs.business }}
          DOCS_BUILT: ${{ needs.detect.outputs.docs }}
          WEB_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID_WEB }}
          BUSINESS_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID_BUSINESS }}
          DOCS_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID_DOCS }}
        run: |
          set -euo pipefail

          roll_if_built() {
            local app="$1" built="$2" container_id="$3"

            if [ "$built" != "true" ]; then
              echo "${app}: unchanged, nothing to roll"
              return 0
            fi

            if [ -z "$container_id" ]; then
              local var_name
              var_name="SCW_CONTAINER_ID_$(echo "$app" | tr '[:lower:]' '[:upper:]')"
              echo "::error::${app} was rebuilt but repository variable ${var_name} is not set"
              return 1
            fi

            .github/scripts/roll-container.sh \
              "$container_id" \
              "${IMAGE_BASE}/openbookings-${app}:${GITHUB_SHA}"
          }

          roll_if_built web      "$WEB_BUILT"      "$WEB_CONTAINER_ID"
          roll_if_built business "$BUSINESS_BUILT" "$BUSINESS_CONTAINER_ID"
          roll_if_built docs     "$DOCS_BUILT"     "$DOCS_CONTAINER_ID"

          if [ "$WEB_BUILT" = "true" ] || [ "$BUSINESS_BUILT" = "true" ] || [ "$DOCS_BUILT" = "true" ]; then
            echo "Released ${GITHUB_SHA}"
          else
            echo "Nothing to release: no app image was rebuilt for ${GITHUB_SHA}"
          fi

      # Rolling to `ready` only proves Scaleway accepted the image. This proves
      # the thing actually answering openbookings.co is running this commit.
      # Only web reports a release: the other three images do not take the
      # NEXT_PUBLIC_RELEASE_SHA build arg.
      - name: Confirm web is serving this commit
        if: needs.detect.outputs.web == 'true'
        env:
          OB_PROBE_TOKEN: ${{ secrets.OB_PROBE_TOKEN }}
        run: .github/scripts/check-release.sh openbookings.co "$GITHUB_SHA"
