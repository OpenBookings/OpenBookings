name: CLA

# Asks first-time contributors to sign the Contributor License Agreement
# (CLA.md) by commenting on their pull request, and records the signature in
# signatures/version1/cla.json on the `cla-signatures` branch. That branch
# must exist and must not be protected, so the action can commit to it.
#
# pull_request_target runs in the context of the base repository, so it can
# comment and set a status on pull requests from forks. It never checks out or
# runs the pull request's code, which is what keeps that safe.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/OpenBookings/OpenBookings/blob/main/CLA.md"
          path-to-signatures: "signatures/version1/cla.json"
          branch: "cla-signatures"
          # The maintainer holds the rights already; bots don't author contributions.
          allowlist: "wouter1203,dependabot[bot],github-actions[bot],claude[bot],Copilot"
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before we can merge it, we need you to sign our
            [Contributor License Agreement](https://github.com/OpenBookings/OpenBookings/blob/main/CLA.md).
            You keep the copyright to your work. Please read it, then reply to this pull request
            with the sentence below. You only need to do this once.
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
