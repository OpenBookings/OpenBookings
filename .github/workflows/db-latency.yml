# TEMPORARY: can the DB suites run against a local Postgres that holds a
# schema-only copy of the Neon CI branch? Measures the copy and the tests.
# Delete after reading.
name: DB latency probe

on:
  push:
    branches: ["claude/confident-lamport-1wxknx"]
    paths: [".github/workflows/db-latency.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      LOCAL_URL: postgres://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Start a local Postgres with Neon's major and PostGIS
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_PASSWORD=pg -p 5432:5432 postgis/postgis:17-3.5
          for i in $(seq 1 60); do
            psql "$LOCAL_URL" -XAtqc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Fetch the parent branch's schema from the Neon API (timed)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/br-frosty-wildflower-alcqwefl/schema?db_name=neondb" \
            | jq -r .sql > schema.sql
          echo "fetch: $(( ($(date +%s%N) - start) / 1000000 )) ms, $(wc -l < schema.sql) lines"
          echo "## statement kinds that mention roles"
          grep -oE '^(ALTER [A-Z ]+ OWNER TO|GRANT|REVOKE|SET ROLE|CREATE ROLE|ALTER DEFAULT PRIVILEGES)' schema.sql | sort | uniq -c || true
          grep -oE 'OWNER TO [a-z_"]+|TO [a-z_"]+;' schema.sql | sort | uniq -c | head -20 || true

      - name: Restore it locally (timed)
        run: |
          set -uo pipefail
          start=$(date +%s%N)
          psql "$LOCAL_URL" -X -q -f schema.sql > restore.log 2>&1
          echo "restore: $(( ($(date +%s%N) - start) / 1000000 )) ms"
          echo "## restore errors"
          grep 'ERROR' restore.log | sed -E 's/^psql:schema.sql:[0-9]+: //' | sort | uniq -c | head -40 || true
          psql "$LOCAL_URL" -XAtc "select 'local tables: ' || count(*) from pg_tables where schemaname='public'"

      - name: Apply this branch's pending migrations locally
        env:
          DATABASE_URL_DIRECT: ${{ env.LOCAL_URL }}
        run: bun run --cwd packages/db db:apply-pending:ci

      - name: Measure local round trip
        run: |
          { echo '\timing on'; for i in $(seq 1 30); do echo 'select 1;'; done; } \
            | psql "$LOCAL_URL" -X -q -o /dev/null 2>&1 \
            | grep -o 'Time: [0-9.]*' | awk '{print $2}' | sort -n \
            | awk '{a[NR]=$1; s+=$1} END {printf "local select 1: median %.2f ms\n", a[int((NR+1)/2)]}'

      - name: Run every suite against local Postgres (timed)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.LOCAL_URL }}
          DATABASE_URL_DIRECT: ${{ env.LOCAL_URL }}
          PENDING_MIGRATIONS_APPLIED: "1"
        run: bunx turbo run test --filter='!@openbookings/demo' --concurrency=4 --no-cache 2>&1 | grep -E '\(fail\)|Ran [0-9]+ tests|[0-9]+ (pass|fail|skip)$|error:|Tasks:|Time:|Failed:' | head -120

