steps:
  # ---------- Build ----------
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-f'
      - apps/business/Dockerfile
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'

      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_POSTHOG_KEY=${_NEXT_PUBLIC_POSTHOG_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_POSTHOG_HOST=${_NEXT_PUBLIC_POSTHOG_HOST}'
      - '--build-arg'
      - 'NEXT_PUBLIC_COOKIE_VERSION=${_NEXT_PUBLIC_COOKIE_VERSION}'
      - '--build-arg'
      - 'NEXT_PUBLIC_MAPTILER_API_KEY=${_NEXT_PUBLIC_MAPTILER_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_MAPTILER_STYLE_ID=${_NEXT_PUBLIC_MAPTILER_STYLE_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SENTRY_DSN=${_NEXT_PUBLIC_SENTRY_DSN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_REALTIME_WORKER_URL=${_NEXT_PUBLIC_REALTIME_WORKER_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_CHATWOOT_BASE_URL=${_NEXT_PUBLIC_CHATWOOT_BASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_CHATWOOT_WEBSITE_TOKEN=${_NEXT_PUBLIC_CHATWOOT_WEBSITE_TOKEN}'
      - '.'

  # ---------- Push ----------
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'

  # ---------- Deploy ----------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - '--image'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region'
      - $_DEPLOY_REGION
      - '--platform'
      - $_PLATFORM
      - '--port'
      - '8081'
      - '--allow-unauthenticated'

# Defaults so a trigger that has not been updated yet still builds. Real values
# belong in the trigger's substitutions, which override anything set here.
# An empty Chatwoot base URL disables the widget and drops it from the CSP.
substitutions:
  _NEXT_PUBLIC_CHATWOOT_BASE_URL: ''
  _NEXT_PUBLIC_CHATWOOT_WEBSITE_TOKEN: ''

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY
