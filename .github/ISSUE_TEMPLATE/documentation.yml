name: Documentation
description: Something in the docs is missing, wrong or unclear.
title: "docs: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      description: A link or the file path under apps/docs/content/docs.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - It's wrong or out of date
        - It's missing
        - It's unclear
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's wrong, and what it should say instead if you know.
    validations:
      required: true
